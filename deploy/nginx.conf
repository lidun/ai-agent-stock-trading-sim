# AI Agent Trading · Web 部署版 Nginx 反代示例（spec-06 §2/§3 单入口部署）
# 用法：前端静态包放 /opt/aat/web/dist；core 监听 127.0.0.1:8001（环回，勿公网直连）。
# 生产请补充 TLS/证书与安全响应头（CSP/HSTS），见 deploy/README.md。

server {
    listen 127.0.0.1:8080;
    server_name _;

    root /opt/aat/web/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 前端路由（BrowserRouter）回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代 → core（环回）
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 反代 → core（环回）
    location /ws {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
